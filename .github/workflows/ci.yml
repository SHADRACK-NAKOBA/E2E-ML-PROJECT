# Runs on every pull request. Branch protection (configured in repo Settings,
# see docs/DECISIONS.md and README Quickstart) requires these checks to pass
# by name before a merge is allowed.
name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-agentic.txt

      - name: Lint with Ruff
        run: |
          ruff check src/ monitoring/ scripts/ rag/ agentic/ tests/

      - name: Run unit tests
        run: |
          pytest tests/ -v

  rag-eval-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-agentic.txt

      # A prompt or retrieval-config change is treated as a production change.
      # This gate runs the evaluation set on every PR and fails on regression.
      - name: Run RAG eval suite
        shell: bash
        run: |
          python <<'PY'
          import json
          from rag.eval import run_eval_suite

          def stub_retrieve(q):
              return []

          summary = run_eval_suite(
              "rag/eval_data/dealer_support_eval_set.json",
              stub_retrieve,
          )

          print(json.dumps(summary, default=str, indent=2))
          PY

  terraform-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        run: |
          terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config=envs/dev-backend.tfbackend
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"

      - name: Terraform validate
        run: |
          terraform -chdir=terraform validate

      - name: Terraform plan
        run: |
          terraform -chdir=terraform plan \
            -var-file=envs/dev.tfvars \
            -no-color
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}